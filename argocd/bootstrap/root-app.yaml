# App-of-Apps — points at the GitOps repo (same as leaf Applications). Bootstrap can still
# substitute repoURL if you revert to REPO_URL_PLACEHOLDER for templating.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fin-enterprise-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: fin-enterprise
  source:
    repoURL: https://github.com/Aravindkasireddy/fin-enterprise-gitops.git
    targetRevision: main
    path: argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
