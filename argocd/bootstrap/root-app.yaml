# App-of-Apps — not applied by scripts/argocd-bootstrap.sh by default: child manifests in this
# directory still use REPO_URL_PLACEHOLDER in git; Argo would sync invalid repo URLs. Bootstrap
# substitutes the URL only for kubectl apply. Re-enable root after templating (Helm/Kustomize)
# or committing resolved repo URLs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fin-enterprise-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: fin-enterprise
  source:
    repoURL: REPO_URL_PLACEHOLDER
    targetRevision: main
    path: argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
