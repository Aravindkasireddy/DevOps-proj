apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fin-enterprise-api-local
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: fin-enterprise-platform
spec:
  project: fin-enterprise
  source:
    repoURL: REPO_URL_PLACEHOLDER
    targetRevision: main
    path: k8s/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: fin-enterprise-local
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # Kind-loaded local image tag is set outside Git; avoid endless OutOfSync
    - group: apps
      kind: Deployment
      name: fin-enterprise-api
      jsonPointers:
        - /spec/template/spec/containers/0/image
