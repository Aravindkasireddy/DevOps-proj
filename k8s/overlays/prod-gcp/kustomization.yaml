apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fin-enterprise-prod

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: fin-enterprise-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ARTIFACTORY_URL/docker-prod-local/financial-enterprise/asset-api:latest

commonLabels:
  environment: production
  cloud: gcp
