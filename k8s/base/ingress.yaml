apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fin-enterprise-api
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.fin-enterprise.example.com
      secretName: fin-enterprise-api-tls
  rules:
    - host: api.fin-enterprise.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fin-enterprise-api
                port:
                  number: 80
