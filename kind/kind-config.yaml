# Financial Enterprise local cluster — 1 control-plane + 2 workers, ingress-ready port maps
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fin-enterprise
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # host:container — access ingress / NodePort services on localhost
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  - role: worker
  - role: worker
