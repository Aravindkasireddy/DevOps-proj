# SonarQube / SonarCloud — shared scanner settings
# Organization + project key are passed from GitHub Actions (repo Variables), not stored here.
# See docs/SONARQUBE.md for one-time setup.

sonar.sources=app
sonar.tests=app/tests
sonar.test.inclusions=**/test_*.py
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
sonar.python.coverage.reportPaths=coverage.xml
