# Shared SonarQube Cloud scan (gate step when SONAR_* not configured).
# Called from SonarQube.yml and from ci-cd.yml before Kind / EKS deploy.
name: Reusable SonarQube scan

on:
  workflow_call:
    # Callers use `secrets: inherit`; the callee must list secrets here (not `inherit`).
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: SonarQube scan
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Sonar configuration
        id: gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "${SONAR_TOKEN}" ] && [ -n "${{ vars.SONAR_ORGANIZATION }}" ] \
            && [ -n "${{ vars.SONAR_PROJECT_KEY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip Sonar (missing configuration)
        if: steps.gate.outputs.enabled != 'true'
        run: 'echo "::notice::Skipping SonarQube — add SONAR_TOKEN and Variables SONAR_ORGANIZATION, SONAR_PROJECT_KEY (see docs/SONARQUBE.md)."'

      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: pip install -e ".[dev]"

      - name: Unit tests with coverage
        if: steps.gate.outputs.enabled == 'true'
        run: pytest app/tests --cov=app --cov-report=xml --cov-report=term

      - name: SonarQube Scan
        if: steps.gate.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
