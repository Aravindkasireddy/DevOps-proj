# Reusable: Docker build only (no push, no Trivy) — PR / develop CI gate
name: Reusable — Docker PR build

on:
  workflow_call:
    inputs:
      image-tag:
        description: Full image tag (e.g. pr-42 or short sha)
        type: string
        required: true

permissions:
  contents: read

jobs:
  build-image:
    name: Build Container (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: docker.io/financial-enterprise/asset-api:${{ inputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
