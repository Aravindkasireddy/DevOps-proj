# Reusable: Python lint, typecheck, SAST, tests + optional Codecov
# Call from ci.yml, ci-cd.yml, or other repos: org/repo/.github/workflows/reusable-python-ci.yml@main
name: Reusable — Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python interpreter version
        type: string
        default: "3.12"
      upload-codecov:
        description: Upload coverage.xml to Codecov
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  code-quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app

      - name: Ruff format check
        run: ruff format --check app

      - name: MyPy
        run: mypy app

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install bandit[toml]
      - name: Bandit scan
        run: bandit -r app -c pyproject.toml -f json -o bandit-report.json || true
      - name: Fail on high severity
        run: bandit -r app -c pyproject.toml -ll

  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Pytest with coverage
        run: pytest app/tests --cov=app --cov-report=xml --cov-report=term
      - name: Upload coverage
        if: ${{ always() && inputs.upload-codecov }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
