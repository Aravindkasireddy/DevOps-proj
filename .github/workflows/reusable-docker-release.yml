# Reusable: Docker build + Trivy + push — GitHub Container Registry (GHCR) first, optional Docker Hub / Artifactory
# End-to-end GitHub: uses GITHUB_TOKEN for ghcr.io (no Docker Hub secret required).
name: Reusable — Docker build scan push

on:
  workflow_call:
    inputs:
      package-name:
        description: GHCR image name (single segment under ghcr.io/owner/)
        type: string
        default: financial-enterprise-asset-api
      dockerhub-image-path:
        description: Optional docker.io path (namespace/image) when mirroring to Docker Hub
        type: string
        default: financial-enterprise/asset-api
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      ARTIFACTORY_URL:
        required: false
      ARTIFACTORY_USER:
        required: false
      ARTIFACTORY_PASSWORD:
        required: false

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  release:
    name: Build · Trivy · Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Reusable workflows: `secrets` cannot be used in `if:` — use step outputs instead.
      - name: Resolve optional registry flags
        id: flags
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ART_URL: ${{ secrets.ARTIFACTORY_URL }}
          ART_USER: ${{ secrets.ARTIFACTORY_USER }}
          ART_PASS: ${{ secrets.ARTIFACTORY_PASSWORD }}
        run: |
          if [ -n "${DH_TOKEN}" ] && [ -n "${DH_USER}" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${ART_URL}" ] && [ -n "${ART_USER}" ] && [ -n "${ART_PASS}" ]; then
            echo "artifactory=true" >> "$GITHUB_OUTPUT"
          else
            echo "artifactory=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute registry image names
        id: reg
        env:
          ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          GHCR="ghcr.io/${OWNER}/${{ inputs.package-name }}"
          echo "ghcr_image=${GHCR}" >> "$GITHUB_OUTPUT"
          echo "scan_tag=${GHCR}:scan-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          {
            echo 'images<<EOF'
            echo "${GHCR}"
            if [ -n "${DH_TOKEN}" ] && [ -n "${DH_USER}" ]; then
              echo "docker.io/${{ inputs.dockerhub-image-path }}"
            fi
            if [ -n "${ARTIFACTORY_URL}" ]; then
              echo "${ARTIFACTORY_URL}/docker-staging-local/${{ inputs.dockerhub-image-path }}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.reg.outputs.images }}
          tags: |
            type=raw,value=${{ github.sha }},enable=true
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v4

      - name: Build image (load for scan)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ steps.reg.outputs.scan_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.reg.outputs.scan_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          # Debian slim often reports unfixed OS CVEs; fail only when a fix exists.
          ignore-unfixed: "true"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Docker Hub (optional mirror)
        if: steps.flags.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login Artifactory (optional)
        if: steps.flags.outputs.artifactory == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ARTIFACTORY_URL }}
          username: ${{ secrets.ARTIFACTORY_USER }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Push images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
