# SonarQube Cloud / Server — static analysis + Python coverage
# Skips until SONAR_TOKEN + repo Variables SONAR_ORGANIZATION + SONAR_PROJECT_KEY are set.
# On `main` push, CI/CD also runs this reusable workflow before Kind/EKS deploy (see ci-cd.yml).
# This workflow: develop pushes + PRs + manual (no duplicate main push vs ci-cd).
# Setup: docs/SONARQUBE.md
name: SonarQube

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarqube:
    name: Scan
    uses: ./.github/workflows/reusable-sonarqube-scan.yml
    secrets: inherit
