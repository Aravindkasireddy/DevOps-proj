# CD — reusable Python CI + Docker build/scan/push (GHCR) + Terraform plan + deploy
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, prod]

# End-to-end GitHub: GHCR push uses GITHUB_TOKEN — requires packages: write
permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

jobs:
  python-ci:
    name: Python quality & tests
    uses: ./.github/workflows/reusable-python-ci.yml
    secrets: inherit
    with:
      python-version: "3.12"
      upload-codecov: true

  build-scan-push:
    name: Build · Trivy · Push Registries
    needs: [python-ci]
    uses: ./.github/workflows/reusable-docker-release.yml
    secrets: inherit
    with:
      package-name: financial-enterprise-asset-api
      dockerhub-image-path: financial-enterprise/asset-api

  terraform-plan:
    name: Terraform Plan (AWS + GCP)
    runs-on: ubuntu-latest
    needs: build-scan-push
    strategy:
      matrix:
        cloud: [aws, gcp]
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform init & plan (${{ matrix.cloud }})
        working-directory: terraform/${{ matrix.cloud }}
        env:
          TF_VAR_environment: staging
        run: |
          terraform init -backend=false
          terraform validate
          terraform plan -input=false -out=tfplan

      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
          output_format: cli

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.cloud }}
          path: terraform/${{ matrix.cloud }}/tfplan

  deploy-staging:
    name: Deploy Staging (Kubernetes)
    runs-on: ubuntu-latest
    needs: [build-scan-push, terraform-plan]
    environment:
      name: staging
      url: https://staging-api.fin-enterprise.example.com
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Update kubeconfig (EKS)
        run: |
          aws eks update-kubeconfig --name fin-enterprise-staging-eks --region us-east-1

      - name: Deploy to EKS (image from GHCR)
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/financial-enterprise-asset-api:${{ github.sha }}"
          kubectl apply -k k8s/overlays/staging
          kubectl set image deployment/fin-enterprise-api api="${IMAGE}" -n fin-enterprise-staging
          kubectl rollout status deployment/fin-enterprise-api -n fin-enterprise-staging --timeout=300s

  deploy-prod-gcp-dr:
    name: Deploy DR slice (GKE)
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to GKE (DR)
        env:
          ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
        run: |
          set -euo pipefail
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/financial-enterprise-asset-api:${{ github.sha }}"
          if [ -n "${ARTIFACTORY_URL}" ]; then
            IMAGE="${ARTIFACTORY_URL}/docker-prod-local/financial-enterprise/asset-api:${{ github.sha }}"
          fi
          gcloud container clusters get-credentials fin-enterprise-prod-gke --region us-central1
          kubectl apply -k k8s/overlays/prod-gcp
          kubectl set image deployment/fin-enterprise-api api="${IMAGE}" -n fin-enterprise-prod
          kubectl rollout status deployment/fin-enterprise-api -n fin-enterprise-prod --timeout=300s
