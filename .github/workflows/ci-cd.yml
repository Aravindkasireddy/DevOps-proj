# CD — Python + Docker (GHCR) + optional Kind “staging” + optional cloud IaC (Terraform) + optional EKS/GKE deploy
# Kind does not use Terraform. Terraform jobs validate AWS/GCP stacks only when TERRAFORM_CI_ENABLED=true.
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, prod]

# End-to-end GitHub: GHCR push uses GITHUB_TOKEN — requires packages: write
permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

jobs:
  python-ci:
    name: Python quality & tests
    uses: ./.github/workflows/reusable-python-ci.yml
    secrets: inherit
    with:
      python-version: "3.12"
      upload-codecov: true

  build-scan-push:
    name: Build · Trivy · Push Registries
    needs: [python-ci]
    uses: ./.github/workflows/reusable-docker-release.yml
    secrets: inherit
    with:
      package-name: financial-enterprise-asset-api
      dockerhub-image-path: financial-enterprise/asset-api

  # Optional: validates terraform/aws + terraform/gcp (not used by Kind). Enable when working on cloud IaC.
  terraform-cloud-iac:
    name: Terraform fmt, Checkov, validate (AWS + GCP)
    runs-on: ubuntu-latest
    needs: [build-scan-push]
    if: vars.TERRAFORM_CI_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/

      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
          output_format: cli

      - name: Terraform init & validate (aws)
        working-directory: terraform/aws
        env:
          TF_VAR_environment: staging
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform init & validate (gcp)
        working-directory: terraform/gcp
        env:
          TF_VAR_environment: staging
          TF_VAR_project: fin-enterprise-demo
        run: |
          terraform init -backend=false
          terraform validate

  # Kind on the runner: same image SHA as GHCR, same k8s overlay as laptop `make kind-apply`.
  deploy-kind:
    name: Deploy to Kind (CI)
    runs-on: ubuntu-latest
    needs: [build-scan-push]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: fin-enterprise
          config: kind/kind-config.yaml

      - name: Pull GHCR image and load into Kind (matches local overlay tag)
        run: |
          set -euo pipefail
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SRC="ghcr.io/${OWNER}/financial-enterprise-asset-api:${{ github.sha }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$SRC"
          docker tag "$SRC" "financial-enterprise/asset-api:local"
          kind load docker-image "financial-enterprise/asset-api:local" --name fin-enterprise

      - name: Apply local overlay & wait for rollouts
        run: |
          kubectl config use-context "kind-fin-enterprise"
          kubectl apply -k k8s/overlays/local
          kubectl rollout status deployment/postgres -n fin-enterprise-local --timeout=180s
          kubectl rollout status deployment/fin-enterprise-api -n fin-enterprise-local --timeout=300s

      - name: Smoke test (NodePort on runner → Kind)
        run: |
          curl -sfS --retry 10 --retry-delay 5 --retry-all-errors "http://127.0.0.1:30080/health"

  deploy-staging:
    name: Deploy Staging (Kubernetes — EKS)
    runs-on: ubuntu-latest
    # Cloud app deploy only — independent of Kind and of Terraform CI (provision clusters with Terraform locally / terraform-apply.yml).
    needs: [build-scan-push]
    environment:
      name: staging
      url: https://staging-api.fin-enterprise.example.com
    # Opt-in: requires AWS OIDC + EKS. Kind “staging” is `deploy-kind` (no Terraform, no AWS).
    if: github.ref == 'refs/heads/main' && vars.EKS_STAGING_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Update kubeconfig (EKS)
        run: |
          aws eks update-kubeconfig --name fin-enterprise-staging-eks --region us-east-1

      - name: Deploy to EKS (image from GHCR)
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/financial-enterprise-asset-api:${{ github.sha }}"
          kubectl apply -k k8s/overlays/staging
          kubectl set image deployment/fin-enterprise-api api="${IMAGE}" -n fin-enterprise-staging
          kubectl rollout status deployment/fin-enterprise-api -n fin-enterprise-staging --timeout=300s

  deploy-prod-gcp-dr:
    name: Deploy DR slice (GKE)
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to GKE (DR)
        env:
          ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
        run: |
          set -euo pipefail
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/financial-enterprise-asset-api:${{ github.sha }}"
          if [ -n "${ARTIFACTORY_URL}" ]; then
            IMAGE="${ARTIFACTORY_URL}/docker-prod-local/financial-enterprise/asset-api:${{ github.sha }}"
          fi
          gcloud container clusters get-credentials fin-enterprise-prod-gke --region us-central1
          kubectl apply -k k8s/overlays/prod-gcp
          kubectl set image deployment/fin-enterprise-api api="${IMAGE}" -n fin-enterprise-prod
          kubectl rollout status deployment/fin-enterprise-api -n fin-enterprise-prod --timeout=300s
