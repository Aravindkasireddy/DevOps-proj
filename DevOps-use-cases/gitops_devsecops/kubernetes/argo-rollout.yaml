# Argo Rollout manifest for progressive Canary delivery of claims microservices
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: claims-api-rollout
  namespace: banking
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: claims-api
  template:
    metadata:
      labels:
        app: claims-api
    spec:
      containers:
        - name: claims-api
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/claims-api:v1.4.3
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
  strategy:
    canary:
      analysis:
        templates:
          - templateName: claims-error-rate-analysis
        args:
          - name: service-name
            value: claims-api-service
      steps:
        - setWeight: 10
        - pause: { duration: 5m }
        - setWeight: 50
        - pause: { duration: 5m }
---
# Argo AnalysisTemplate to poll Prometheus for HTTP errors
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: claims-error-rate-analysis
  namespace: banking
spec:
  metrics:
    - name: http-error-rate
      interval: 30s
      successCondition: result[0] < 0.01
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus-k8s.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{status=~"5.*",service="{{args.service-name}}"}[2m])) 
            / 
            sum(rate(http_requests_total{service="{{args.service-name}}"}[2m]))
