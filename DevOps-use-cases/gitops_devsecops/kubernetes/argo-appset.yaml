# ArgoCD ApplicationSet to sync banking services across regional clusters
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: usaa-banking-appset
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: us-east-1-prod
            server: https://10.100.0.1:443
          - cluster: us-west-2-prod
            server: https://10.200.0.1:443
  template:
    metadata:
      name: '{{cluster}}-banking-service'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/usaa-ops/gitops-banking-config.git'
        targetRevision: HEAD
        path: deployments/banking-service
      destination:
        server: '{{server}}'
        namespace: banking
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
